<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathMaster - Maths Challenge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            color: #4b2aad;
            font-size: 32px;
        }

        .subtitle {
            color: #777;
            margin: 8px 0 25px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat {
            flex: 1;
            background: #f1edff;
            padding: 12px;
            border-radius: 15px;
        }

        .stat span {
            display: block;
            font-size: 13px;
            color: #777;
        }

        .stat strong {
            display: block;
            font-size: 22px;
            color: #4b2aad;
            margin-top: 4px;
        }

        .question-box {
            background: linear-gradient(135deg, #f8f5ff, #eee8ff);
            border-radius: 20px;
            padding: 30px 15px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 42px;
            font-weight: bold;
            color: #222;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-size: 22px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #6c4ce8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .check-btn {
            background: #6c4ce8;
            color: white;
        }

        .check-btn:hover {
            background: #5434d1;
            transform: translateY(-2px);
        }

        .new-btn {
            background: #eee9ff;
            color: #5535cf;
            margin-top: 10px;
        }

        .new-btn:hover {
            background: #ddd4ff;
        }

        .message {
            min-height: 28px;
            margin: 15px 0 5px;
            font-weight: bold;
            font-size: 17px;
        }

        .correct {
            color: #16a34a;
        }

        .wrong {
            color: #dc2626;
        }

        .start-screen {
            display: block;
        }

        .game-screen {
            display: none;
        }

        .start-btn {
            background: #6c4ce8;
            color: white;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: #5434d1;
            transform: scale(1.02);
        }

        .final-score {
            font-size: 28px;
            color: #4b2aad;
            font-weight: bold;
            margin: 20px 0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }

            .question {
                font-size: 34px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- START SCREEN -->
    <div class="start-screen" id="startScreen">
        <div class="logo">🧮</div>

        <h1>MathMaster</h1>

        <p class="subtitle">
            Test your maths skills!
        </p>

        <div class="question-box">
            <h2>Ready for the challenge?</h2>
            <p style="margin-top:10px; color:#777;">
                Solve as many questions as you can.
            </p>
        </div>

        <button class="start-btn" onclick="startGame()">
            🚀 Start Game
        </button>
    </div>


    <!-- GAME SCREEN -->
    <div class="game-screen" id="gameScreen">

        <div class="logo">🧮</div>

        <h1>MathMaster</h1>

        <p class="subtitle">Solve the question!</p>

        <div class="stats">

            <div class="stat">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>Question</span>
                <strong id="questionNumber">1</strong>
            </div>

            <div class="stat">
                <span>Time</span>
                <strong id="timer">60</strong>
            </div>

        </div>

        <div class="question-box">
            <div class="question" id="question">
                5 + 5 = ?
            </div>
        </div>

        <input
            type="number"
            id="answer"
            placeholder="Enter answer"
            onkeydown="handleEnter(event)"
        >

        <button class="check-btn" onclick="checkAnswer()">
            ✓ Check Answer
        </button>

        <div class="message" id="message"></div>

        <button class="new-btn" onclick="newQuestion()">
            🔄 New Question
        </button>

    </div>


    <!-- END SCREEN -->
    <div id="endScreen" style="display:none;">

        <div class="logo">🏆</div>

        <h1>Game Over!</h1>

        <p class="subtitle">
            Great job! Here is your final score.
        </p>

        <div class="question-box">
            <div class="final-score">
                Score: <span id="finalScore">0</span>
            </div>

            <p id="resultText"></p>
        </div>

        <button class="start-btn" onclick="restartGame()">
            🔄 Play Again
        </button>

    </div>

</div>


<script>

    let score = 0;
    let questionCount = 1;
    let timeLeft = 60;
    let correctAnswer = 0;
    let timerInterval;
    let answered = false;


    function startGame() {

        document.getElementById("startScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        document.getElementById("endScreen").style.display = "none";

        score = 0;
        questionCount = 1;
        timeLeft = 60;

        document.getElementById("score").textContent = score;
        document.getElementById("questionNumber").textContent = questionCount;
        document.getElementById("timer").textContent = timeLeft;

        newQuestion();

        clearInterval(timerInterval);

        timerInterval = setInterval(function() {

            timeLeft--;

            document.getElementById("timer").textContent = timeLeft;

            if (timeLeft <= 0) {
                endGame();
            }

        }, 1000);
    }


    function newQuestion() {

        answered = false;

        document.getElementById("answer").value = "";
        document.getElementById("message").textContent = "";
        document.getElementById("message").className = "message";

        let num1 = Math.floor(Math.random() * 20) + 1;
        let num2 = Math.floor(Math.random() * 20) + 1;

        let operations = ["+", "-", "×", "÷"];
        let operation = operations[Math.floor(Math.random() * operations.length)];


        if (operation === "+") {

            correctAnswer = num1 + num2;

        }


        else if (operation === "-") {

            if (num2 > num1) {
                let temp = num1;
                num1 = num2;
                num2 = temp;
            }

            correctAnswer = num1 - num2;

        }


        else if (operation === "×") {

            correctAnswer = num1 * num2;

        }


        else if (operation === "÷") {

            num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = Math.floor(Math.random() * 10) + 1;

            num1 = num2 * correctAnswer;

        }


        document.getElementById("question").textContent =
            `${num1} ${operation} ${num2} = ?`;

        document.getElementById("answer").focus();
    }


    function checkAnswer() {

        if (answered) return;

        let userAnswer = Number(
            document.getElementById("answer").value
        );

        let message = document.getElementById("message");


        if (
            document.getElementById("answer").value === ""
        ) {

            message.textContent = "⚠️ Please enter an answer.";
            message.className = "message wrong";
            return;

        }


        if (userAnswer === correctAnswer) {

            score += 10;

            message.textContent = "🎉 Correct! +10 points";
            message.className = "message correct";

            document.getElementById("score").textContent = score;

            answered = true;

            setTimeout(function() {

                questionCount++;

                document.getElementById("questionNumber").textContent =
                    questionCount;

                newQuestion();

            }, 700);

        }


        else {

            message.textContent =
                "❌ Wrong! Try the next one.";

            message.className = "message wrong";

            answered = true;

            setTimeout(function() {

                questionCount++;

                document.getElementById("questionNumber").textContent =
                    questionCount;

                newQuestion();

            }, 900);

        }

    }


    function handleEnter(event) {

        if (event.key === "Enter") {
            checkAnswer();
        }

    }


    function endGame() {

        clearInterval(timerInterval);

        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("endScreen").style.display = "block";

        document.getElementById("finalScore").textContent = score;

        let result = document.getElementById("resultText");

        if (score >= 100) {
            result.textContent = "🔥 Amazing! You are a Maths Master!";
        }

        else if (score >= 50) {
            result.textContent = "👏 Great work! Keep practicing!";
        }

        else {
            result.textContent = "💪 Keep practicing and try again!";
        }

    }


    function restartGame() {

        document.getElementById("endScreen").style.display = "none";

        startGame();

    }

</script>

</body>
</html>
